<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle with safe margin for Android maskable icons -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Truck Container Trailer Body -->
  <rect x="96" y="160" width="200" height="150" rx="12" fill="#334155" stroke="#64748b" stroke-width="4"/>
  <!-- Trailer Ribs / Corrugation -->
  <line x1="136" y1="172" x2="136" y2="298" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="176" y1="172" x2="176" y2="298" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="216" y1="172" x2="216" y2="298" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="172" x2="256" y2="298" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Truck Cab (Cabin) -->
  <path d="M 296 200 L 350 200 L 388 248 L 388 310 L 296 310 Z" fill="url(#truckGrad)" stroke="#60a5fa" stroke-width="4" stroke-linejoin="round"/>
  <!-- Cab Window -->
  <path d="M 306 210 L 344 210 L 372 248 L 306 248 Z" fill="#93c5fd" opacity="0.9"/>
  <!-- Cab Headlight -->
  <rect x="376" y="278" width="14" height="18" rx="4" fill="#fbbf24"/>

  <!-- Chassis line -->
  <rect x="86" y="304" width="310" height="14" rx="4" fill="#1e293b"/>

  <!-- Wheels -->
  <!-- Rear Wheels -->
  <circle cx="140" cy="326" r="28" fill="#0f172a" stroke="#64748b" stroke-width="5"/>
  <circle cx="140" cy="326" r="14" fill="#94a3b8"/>
  <circle cx="200" cy="326" r="28" fill="#0f172a" stroke="#64748b" stroke-width="5"/>
  <circle cx="200" cy="326" r="14" fill="#94a3b8"/>
  <!-- Front Wheel -->
  <circle cx="350" cy="326" r="28" fill="#0f172a" stroke="#64748b" stroke-width="5"/>
  <circle cx="350" cy="326" r="14" fill="#94a3b8"/>

  <!-- Checkmark / Dispatch badge -->
  <circle cx="380" cy="140" r="44" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="5"/>
  <path d="M 364 140 L 375 151 L 398 127" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
